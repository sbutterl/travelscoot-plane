<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Travelscoot → Plane</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">
      <span class="badge">Build</span>
      <h1>Travelscoot → Plane</h1>
    </div>

    <div class="hud">
      <div id="status" class="status">Drag parts onto the scoot. They’ll snap!</div>
      <button id="resetBtn" class="btn secondary" type="button">Reset</button>
    </div>
  </header>

  <main class="stage">
    <canvas id="c"></canvas>

    <!-- Touch controls (shown automatically on touch devices) -->
    <div id="touchControls" class="touch hidden" aria-hidden="true">
      <div class="joystickWrap">
        <div class="joystick" id="joy">
          <div class="knob" id="knob"></div>
        </div>
        <div class="hint">Drag the joystick to fly</div>
      </div>

      <button id="boostBtn" class="btn" type="button">Boost</button>
    </div>

    <div id="help" class="help">
      <div class="card">
        <div class="row">
          <strong>Builder:</strong>
          <span>Drag wings, tail, propeller onto the scoot</span>
        </div>
        <div class="row">
          <strong>Desktop:</strong>
          <span>Arrow keys / WASD to fly, Space to boost</span>
        </div>
        <div class="row">
          <strong>Tablet:</strong>
          <span>Use the on-screen joystick + Boost button</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="bottombar">
    <div class="partsTitle">Parts</div>
    <div class="partsTray" id="tray">
      <!-- Parts are drawn on the canvas, but we show labels here for clarity -->
      <div class="pill" data-part="wings">Wings</div>
      <div class="pill" data-part="tail">Tail</div>
      <div class="pill" data-part="prop">Propeller</div>
    </div>
  </footer>

  <script src="game.js"></script>
</body>
</html>
